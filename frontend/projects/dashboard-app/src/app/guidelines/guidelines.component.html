<main class="flex-1 overflow-y-auto px-5 py-6 bg-gray-50">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-2" style="font-family: 'Outfit', sans-serif">Admin Guidelines</h1>
    <p class="text-gray-600 text-sm mb-6" style="font-family: 'DM Sans', sans-serif">Essential protocols for managing lost and found items</p>

    <!-- Toggle Switch -->
    <div class="inline-flex rounded-xl border border-gray-200 bg-white shadow-sm p-1 mb-6">
      <button
        (click)="setActive('lost')"
        class="flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-medium transition-all duration-200"
        [ngClass]="{
          'bg-cyan-600 text-white shadow-sm': active === 'lost',
          'text-gray-500 hover:text-gray-700': active !== 'lost'
        }"
        style="font-family: 'DM Sans', sans-serif;"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        Lost Items Rules
      </button>
      <button
        (click)="setActive('found')"
        class="flex items-center gap-2 px-5 py-2 rounded-lg text-sm font-medium transition-all duration-200"
        [ngClass]="{
          'bg-amber-500 text-white shadow-sm': active === 'found',
          'text-gray-500 hover:text-gray-700': active !== 'found'
        }"
        style="font-family: 'DM Sans', sans-serif;"
      >
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        Found Items Rules
      </button>
    </div>

    <!-- Active Panel -->
    <div *ngIf="active === 'lost'" class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-9 h-9 rounded-lg bg-cyan-100 flex items-center justify-center shrink-0">
          <svg class="text-cyan-600 w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div>
          <h2 class="text-base font-bold text-gray-900" style="font-family: 'Outfit', sans-serif">Lost Items Rules</h2>
          <p class="text-gray-500 text-xs" style="font-family: 'DM Sans', sans-serif">Protocols for returning lost items to students</p>
        </div>
      </div>
      
      <div class="space-y-3">
        <div *ngFor="let g of lostRules" class="flex items-start gap-3 p-3 rounded-lg bg-gray-50 border border-gray-100">
          <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5 bg-cyan-100">
            <svg class="text-cyan-600 w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </span>
          <p class="text-gray-700 text-sm leading-relaxed" style="font-family: 'DM Sans', sans-serif;">{{ g }}</p>
        </div>
      </div>
    </div>

    <div *ngIf="active === 'found'" class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-9 h-9 rounded-lg bg-amber-100 flex items-center justify-center shrink-0">
          <svg class="text-amber-600 w-[18px] h-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <div>
          <h2 class="text-base font-bold text-gray-900" style="font-family: 'Outfit', sans-serif">Found Items Rules</h2>
          <p class="text-gray-500 text-xs" style="font-family: 'DM Sans', sans-serif">Protocols for accepting and storing found items</p>
        </div>
      </div>
      
      <div class="space-y-3">
        <div *ngFor="let g of foundRules" class="flex items-start gap-3 p-3 rounded-lg bg-gray-50 border border-gray-100">
          <span class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5 bg-amber-100">
            <svg class="text-amber-600 w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </span>
          <p class="text-gray-700 text-sm leading-relaxed" style="font-family: 'DM Sans', sans-serif;">{{ g }}</p>
        </div>
      </div>
    </div>
  </div>
</main>
