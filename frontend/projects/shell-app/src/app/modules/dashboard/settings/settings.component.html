<main class="flex-1 overflow-y-auto px-5 py-4 bg-gray-50">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-xl font-bold text-gray-900 mb-2" style="font-family: 'Outfit', sans-serif">Settings</h1>
    <p class="text-gray-600 text-sm mb-6" style="font-family: 'DM Sans', sans-serif">Manage your account and preferences</p>

    <div class="space-y-4">
      <!-- Account Section -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
        <h2 class="text-base font-semibold text-gray-900 mb-4" style="font-family: 'Outfit', sans-serif">Account</h2>
        <div class="space-y-3">
          <div class="flex items-center justify-between py-2">
            <div>
              <p class="text-sm font-medium text-gray-900" style="font-family: 'DM Sans', sans-serif">Email</p>
              <p class="text-xs text-gray-500">{{ currentUser?.email || 'admin@campus.edu' }}</p>
            </div>
          </div>
          <div class="flex items-center justify-between py-2 border-t border-gray-100">
            <div>
              <p class="text-sm font-medium text-gray-900" style="font-family: 'DM Sans', sans-serif">Role</p>
              <p class="text-xs text-gray-500">{{ currentUser?.role || 'ADMIN' | titlecase }}</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Logout Section -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
        <h2 class="text-base font-semibold text-gray-900 mb-4" style="font-family: 'Outfit', sans-serif">Session</h2>
        <button
          (click)="openLogoutModal()"
          class="flex items-center gap-2 px-4 py-2.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 hover:border-red-300 font-medium text-sm transition-all duration-150 w-full justify-center border border-red-200 shadow-sm"
          style="font-family: 'DM Sans', sans-serif"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Logout
        </button>
      </div>
    </div>
  </div>

  <!-- Logout Confirmation Modal -->
  <ds-logout-modal
    *ngIf="showLogoutModal"
    (confirm)="confirmLogout()"
    (close)="closeLogoutModal()"
  ></ds-logout-modal>
</main>
